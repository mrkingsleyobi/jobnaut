version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: jobnaut-db-prod
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    # Database should NOT be exposed to host - only accessible within Docker network
    # ports:
    #   - "5432:5432"  # REMOVED FOR SECURITY
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Backend API Service
  backend:
    image: jobnaut/backend:latest
    container_name: jobnaut-backend-prod
    ports:
      - '3000:3000'
    secrets:
      - db_user
      - db_password
      - db_name
      - clerk_secret_key
      - encryption_key
      - redis_password
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Database URL constructed from secrets at runtime
      - DATABASE_URL=postgresql://$(cat /run/secrets/db_user):$(cat /run/secrets/db_password)@database:5432/$(cat /run/secrets/db_name)
      - REDIS_URL=redis://:$(cat /run/secrets/redis_password)@redis:6379
      - REDIS_TTL=300
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend Service
  frontend:
    image: jobnaut/frontend:latest
    container_name: jobnaut-frontend-prod
    ports:
      - '3001:80'
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Meilisearch Service
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: jobnaut-meilisearch-prod
    ports:
      - '7700:7700'
    secrets:
      - meili_master_key
    environment:
      - MEILI_MASTER_KEY_FILE=/run/secrets/meili_master_key
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: jobnaut-redis-prod
    # Redis should NOT be exposed to host - only accessible within Docker network
    # ports:
    #   - "6379:6379"  # REMOVED FOR SECURITY
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass $(cat /run/secrets/redis_password)
    secrets:
      - redis_password
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '$(cat /run/secrets/redis_password)', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
  meilisearch_data:
  redis_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
  clerk_secret_key:
    file: ./secrets/clerk_secret_key.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  meili_master_key:
    file: ./secrets/meili_master_key.txt
  redis_password:
    file: ./secrets/redis_password.txt
